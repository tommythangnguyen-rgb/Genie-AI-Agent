<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 74" fill="none">
  <defs>
    <!-- Diagonal gold gradient: bright top-left → rich amber bottom-right -->
    <linearGradient id="g" x1="2" y1="4" x2="54" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFF8C8"/>
      <stop offset="18%"  stop-color="#F5D040"/>
      <stop offset="45%"  stop-color="#D4AF37"/>
      <stop offset="72%"  stop-color="#B8900C"/>
      <stop offset="100%" stop-color="#D4A820"/>
    </linearGradient>
    <!-- Horizontal sheen: bright left (lit) → dark right (shadow) -->
    <linearGradient id="s" x1="0" y1="0" x2="56" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.44"/>
      <stop offset="32%"  stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="55%"  stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <!-- Radial sphere glow: upper-left highlight on body -->
    <radialGradient id="rg" cx="34%" cy="28%" r="56%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FFFBE0" stop-opacity="0.60"/>
      <stop offset="55%"  stop-color="#F2C94C" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8B6914" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle ambient for cap top -->
    <linearGradient id="capg" x1="15" y1="4" x2="41" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFF5C0"/>
      <stop offset="100%" stop-color="#C8A020"/>
    </linearGradient>
  </defs>

  <!-- ── CAP / STOPPER ─────────────────────────────────── -->
  <rect x="15" y="4" width="26" height="11" rx="2.5" fill="url(#capg)"/>
  <rect x="15" y="4" width="26" height="11" rx="2.5" fill="url(#s)"/>
  <!-- Cap top gleam -->
  <path d="M17.5 6.5 L38.5 6.5" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.36"/>

  <!-- ── NECK ───────────────────────────────────────────── -->
  <rect x="20" y="15" width="16" height="11" fill="url(#g)"/>
  <rect x="20" y="15" width="16" height="11" fill="url(#s)"/>

  <!-- Cap-to-neck connector line (premium seam) -->
  <path d="M15 15 L41 15" stroke="rgba(180,130,8,0.55)" stroke-width="0.7" fill="none"/>
  <!-- Neck-to-body seam -->
  <path d="M20.5 25.8 L35.5 25.8" stroke="rgba(212,175,55,0.55)" stroke-width="0.6" fill="none"/>

  <!-- ── BODY ───────────────────────────────────────────── -->
  <path d="
    M 20 26
    C  5 26  1 40  1 52
    C  1 64 12 72 28 72
    C 44 72 55 64 55 52
    C 55 40 51 26 36 26
    Z
  " fill="url(#g)"/>
  <!-- Horizontal sheen on body -->
  <path d="
    M 20 26
    C  5 26  1 40  1 52
    C  1 64 12 72 28 72
    C 44 72 55 64 55 52
    C 55 40 51 26 36 26
    Z
  " fill="url(#s)"/>
  <!-- Sphere radial glow (upper-left hot-spot) -->
  <path d="
    M 20 26
    C  5 26  1 40  1 52
    C  1 64 12 72 28 72
    C 44 72 55 64 55 52
    C 55 40 51 26 36 26
    Z
  " fill="url(#rg)"/>

  <!-- Left-side inner highlight ellipse (3-D round feel) -->
  <ellipse cx="13.5" cy="47" rx="4" ry="9.5"
           fill="white" opacity="0.09"
           transform="rotate(-10 13.5 47)"/>

  <!-- Decorative mid-band (subtle engraving line) -->
  <path d="M 4 54 Q 28 58 52 54" stroke="rgba(255,215,0,0.22)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
</svg>
